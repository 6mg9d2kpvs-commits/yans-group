name: Publish YAN GROUP
on:
  push:
    branches: [main]
    paths: [site.zip, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Unpack verified static website
        run: |
          unzip -q site.zip -d _site
          test -f _site/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          include-hidden-files: true
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
